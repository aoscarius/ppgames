<!-- ==========================================================
     GO MODULE MARKUP. Loaded on demand by core/game-registry.js
     (loadGame('go')). Each <template data-slot="..."> is moved into
     the matching [data-mount="..."] element of the core shell.
     ========================================================== -->

<template data-slot="board">
          <div id="goBoardSection" data-game-board="go" class="hidden w-full max-w-2xl mx-auto flex-1 flex flex-col items-center justify-center gap-2 my-auto">

              <!-- White player (top) -->
              <div id="goTopBar" class="w-full max-w-md flex items-center justify-between gap-2 px-3 py-2 rounded-2xl bg-slate-900/90 border border-slate-800">
                  <div class="flex items-center gap-2 min-w-0">
                      <img id="goTopAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=opponent" class="w-8 h-8 rounded-full border border-slate-700 shrink-0" alt="">
                      <div id="goTopName" class="text-xs font-extrabold text-white truncate">—</div>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                      <span class="go-stone-chip go-stone-white"></span>
                      <span id="goTopInfo" class="text-xs font-black text-slate-200 min-w-[2ch] text-right"></span>
                      <span id="goTopClockDot" class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
                  </div>
              </div>

              <div class="relative">
                  <div id="goBoard" class="go-board"></div>
              </div>

              <!-- Black player (bottom) -->
              <div id="goBottomBar" class="w-full max-w-md flex items-center justify-between gap-2 px-3 py-2 rounded-2xl bg-slate-900/90 border border-slate-800">
                  <div class="flex items-center gap-2 min-w-0">
                      <img id="goBottomAvatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=you" class="w-8 h-8 rounded-full border border-slate-700 shrink-0" alt="">
                      <div id="goBottomName" class="text-xs font-extrabold text-white truncate">—</div>
                  </div>
                  <div class="flex items-center gap-2 shrink-0">
                      <span class="go-stone-chip go-stone-black"></span>
                      <span id="goBottomInfo" class="text-xs font-black text-slate-200 min-w-[2ch] text-right"></span>
                      <span id="goBottomClockDot" class="w-2.5 h-2.5 rounded-full bg-slate-700"></span>
                  </div>
              </div>

              <div id="goPhaseText" class="text-[10px] sm:text-xs font-black uppercase tracking-[0.18em] text-lime-300 text-center">Lobby Waiting</div>
              <div id="goStatusSummary" class="text-xs sm:text-sm font-bold text-slate-300 px-2 text-center max-w-full">Waiting for players...</div>

              <!-- Board size (host, between matches) -->
              <div id="goSizeWrap" class="hidden w-full max-w-md flex items-center justify-between gap-2 px-3 py-1.5 rounded-xl bg-slate-900/70 border border-slate-800">
                  <label for="goSizeSelect" class="text-[11px] font-bold text-slate-300" data-i18n="goBoardSize">Board size</label>
                  <select id="goSizeSelect" class="bg-slate-800 border border-slate-700 text-slate-100 text-xs font-bold rounded-lg px-2 py-1">
                      <option value="9">9 × 9</option>
                      <option value="13">13 × 13</option>
                      <option value="19">19 × 19</option>
                  </select>
              </div>

              <div class="w-full max-w-md mt-1 shrink-0">
                  <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl flex items-center justify-between gap-2 backdrop-blur-md">
                      <button id="startGoBtn" disabled class="items-center px-3.5 sm:px-5 py-1.5 rounded-xl bg-gradient-to-r from-lime-500 to-emerald-500 hover:from-lime-400 hover:to-emerald-400 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold shadow transition">
                          <i class="fa-solid fa-circle"></i> <span data-i18n="goStartMatch">Start Match</span>
                      </button>
                      <div class="flex items-center gap-1.5 sm:gap-2">
                          <button id="goPassBtn" disabled class="px-3 sm:px-4 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold transition" data-i18n="goPass">Pass</button>
                          <button id="goAcceptBtn" class="hidden px-3 sm:px-4 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold transition" data-i18n="goAccept">Accept</button>
                          <button id="goResumeBtn" class="hidden px-3 sm:px-4 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold transition" data-i18n="goResume">Resume play</button>
                          <button id="goResignBtn" disabled class="px-3 sm:px-4 py-1.5 rounded-xl bg-rose-950/60 hover:bg-rose-900 disabled:opacity-30 disabled:pointer-events-none text-rose-300 text-xs font-extrabold transition" data-i18n="goResign">Resign</button>
                      </div>
                  </div>
              </div>
          </div>
</template>
