<!-- ==========================================================
     POKER MODULE MARKUP. Loaded on demand by core/game-registry.js
     (loadGame('poker')). Each <template data-slot="..."> is moved into
     the matching [data-mount="..."] element of the core shell:
       overlay        -> full-screen extra screens (table configuration)
       headerActions  -> extra buttons in the game header
       board          -> the game board itself (inside <main>)
     ========================================================== -->
<template data-slot="overlay">
    <!-- POKER TABLE CONFIGURATION -->
    <div id="pokerConfigScreen" data-screen class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-md overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl my-auto">
            <div class="mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center text-2xl">♠</div>
                    <div>
                        <h1 class="text-xl font-black text-white" data-i18n="tableConfiguration">Table Configuration</h1>
                        <p class="text-xs text-slate-400 mt-1" data-i18n="tableConfigurationHint">Set the starting stack and limits for this poker room.</p>
                    </div>
                </div>
            </div>

            <div id="pokerConfigForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5" data-i18n="currency">Currency</label>
                    <select id="currencySelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-500">
                        <option value="USD" data-i18n="usd">USD ($)</option>
                        <option value="EUR" data-i18n="eur">EUR (€)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" data-i18n="startingValue">Starting value / player</label>
                        <input id="startingStackInput" type="number" min="1" step="10" value="1000" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" data-i18n="maxSeats">Maximum seats</label>
                        <select id="maxSeatsSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-500">
                            <option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8" selected>8</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5" data-i18n="variant">Poker variant</label>
                    <select id="variantConfigSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-500">
                        <option value="holdem">Texas Hold'em</option>
                        <option value="5card">5-Card Draw</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" data-i18n="smallBlindLabel">Small blind</label>
                        <input id="smallBlindInput" type="number" min="1" step="1" value="10" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5" data-i18n="bigBlindLabel">Big blind</label>
                        <input id="bigBlindInput" type="number" min="1" step="1" value="20" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div id="configError" class="hidden text-xs text-rose-300 bg-rose-950/40 border border-rose-800/50 rounded-xl p-3"></div>
            </div>

            <div class="mt-6 flex justify-between gap-2">
                <button id="pokerConfigBackBtn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold" data-i18n="backBtn">Back</button>
                <button id="pokerConfigContinueBtn" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black" data-i18n="continueBtn">Continue</button>
            </div>
        </div>
    </div>
</template>

<template data-slot="board">
          <!-- POKER BOARD (hidden when gameState.gameId !== 'poker', see renderTableUI() in ui.js) -->
          <div id="pokerBoardSection" data-game-board="poker" class="contents">
            <!-- General infos -->
            <div id="gamePhaseText" class="text-[10px] sm:text-xs font-black uppercase tracking-[0.18em] text-emerald-300 text-center">Lobby Waiting</div>

            <!-- Responsive Table Felt Container -->
            <div class="w-full max-w-6xl my-auto relative flex flex-col items-center justify-center">
                <div class="w-full aspect-[0.35/1] max-h-[66vh] rounded-[90px] sm:rounded-[180px] poker-felt relative flex flex-col items-center justify-center p-3 sm:p-6">
                    <div class="absolute inset-3 sm:inset-6 rounded-[75px] sm:rounded-[160px] border border-emerald-400/20 pointer-events-none"></div>
                    <div class="absolute inset-[9%] rounded-[70px] sm:rounded-[140px] border border-white/5 pointer-events-none"></div>

                    <!-- Redesigned center board -->
                    <div id="centerBoard" class="center-board z-20 flex flex-col items-center justify-center gap-2 sm:gap-3 px-3 py-3 sm:px-5 sm:py-4 rounded-3xl border border-emerald-400/30 backdrop-blur-xl shadow-2xl">
                        <div class="flex items-center gap-2 sm:gap-3">
                            <div class="board-stat">
                                <span data-i18n="pot">Pot</span>
                                <strong id="potDisplay">$0</strong>
                            </div>
                            <div class="board-stat board-stat-muted">
                                <span data-i18n="currentBet">Current Bet</span>
                                <strong id="currentBetDisplay">$0</strong>
                            </div>
                        </div>
                        <div id="communityCards" class="flex items-center justify-center gap-1 sm:gap-2 min-h-[54px] sm:min-h-[76px] w-full">
                            <span class="text-slate-400 text-[11px] sm:text-xs italic" data-i18n="waitingDealer">Waiting for dealer...</span>
                        </div>

                    </div>

                    <div id="seat-0" class="poker-seat"></div>
                    <div id="seat-1" class="poker-seat"></div>
                    <div id="seat-2" class="poker-seat"></div>
                    <div id="seat-3" class="poker-seat"></div>
                    <div id="seat-4" class="poker-seat"></div>
                    <div id="seat-5" class="poker-seat"></div>
                    <div id="seat-6" class="poker-seat"></div>
                    <div id="seat-7" class="poker-seat"></div>
                </div>
            </div>

            <!-- General infos -->
            <div id="playerHandSummary" class="text-xs sm:text-sm font-bold text-slate-300 px-2 text-center truncate max-w-full">Waiting for players...</div>

            <!-- Bottom Controls Container -->
            <div class="w-full max-w-4xl mt-2 shrink-0 space-y-2">
                
                <!-- Player Gameplay Action Buttons -->
                <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl flex items-center justify-between gap-2 backdrop-blur-md">
                    <button id="startGameBtn" disabled class="deal-hand-btn items-center px-3.5 sm:px-4 py-1.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 disabled:opacity-30 disabled:pointer-events-none text-white text-xs sm:text-[0.65rem] font-extrabold shadow transition">
                        <i class="fa-solid fa-clover text-amber-200"></i> 
                        <span data-i18n="dealHand">Deal Hand</span>
                    </button>
                    <div id="actionControls" class="flex items-center justify-end gap-1.5 sm:gap-2">
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-1.5 sm:gap-2">                        
                            <button id="drawBtn" disabled class="px-3.5 w-full sm:px-4 py-1.5 rounded-xl bg-purple-600 hover:bg-purple-500 disabled:opacity-30 disabled:pointer-events-none text-purple-100 text-xs font-extrabold transition" data-i18n="draw">
                                Draw
                            </button>
                            <button id="foldBtn" disabled class="px-3.5 w-full sm:px-4 py-1.5 rounded-xl bg-rose-950/60 hover:bg-rose-900 disabled:opacity-30 disabled:pointer-events-none text-rose-300 text-xs font-extrabold transition" data-i18n="fold">
                                Fold
                            </button>
                            <button id="checkCallBtn" disabled class="px-3.5 w-full sm:px-4 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold shadow transition" data-i18n="check">
                                Check
                            </button>
                        </div>
                        <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-xl border border-slate-700">
                            <input id="raiseInput" type="number" min="20" step="10" value="40" class="w-14 sm:w-16 bg-slate-900 border border-slate-700 rounded-lg px-1 py-0.5 text-xs font-mono text-emerald-400 font-bold outline-none text-center">
                            <button id="raiseBtn" disabled class="px-3 sm:px-4 py-1 rounded-lg bg-amber-600 hover:bg-amber-500 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold transition" data-i18n="raise">
                                Raise
                            </button>
                        </div>
                        <button id="allInBtn" disabled class="px-3 sm:px-4 py-1.5 rounded-xl bg-fuchsia-700 hover:bg-fuchsia-600 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold transition" data-i18n="allIn">
                            All-in
                        </button>
                    </div>
                </div>

            </div>
          </div>
          <!-- /POKER BOARD -->
</template>
