<!-- ==========================================================
     MONOPOLIO MODULE MARKUP. Loaded on demand by core/game-registry.js
     (loadGame('monopolio')). Each <template data-slot="..."> is moved into
     the matching [data-mount="..."] element of the core shell.
     The 40 squares are generated by ui.js (ensureMonoBoard) and inserted
     before #monoCenter inside #monoBoard.
     ========================================================== -->

<template data-slot="board">
          <div id="monoBoardSection" data-game-board="monopolio" class="hidden w-full max-w-4xl mx-auto flex-1 flex flex-col items-center gap-2 my-auto">

              <!-- Players (seats in the lobby, cash/titles during the match) -->
              <div id="monoPlayers" class="mono-players w-full max-w-[620px]"></div>

              <!-- Board -->
              <div id="monoBoard" class="mono-board">
                  <div id="monoCenter" class="mono-center">
                      <div id="monoCenterTitle" class="mono-center-title">—</div>
                      <div id="monoDice" class="mono-dice"><span id="monoDie1"></span><span id="monoDie2"></span></div>
                      <div id="monoStatus" class="mono-status"></div>
                      <div id="monoCardText" class="mono-card hidden"></div>
                      <div class="mono-actions">
                          <button id="monoRollBtn" class="hidden mono-btn mono-btn-main"><i class="fa-solid fa-dice"></i> <span data-i18n="monRoll">Roll dice</span></button>
                          <button id="monoJailPayBtn" class="hidden mono-btn" data-i18n="monJailPay">Pay €50</button>
                          <button id="monoJailCardBtn" class="hidden mono-btn" data-i18n="monJailCard">Use jail card</button>
                          <button id="monoBuyBtn" class="hidden mono-btn mono-btn-main">Buy</button>
                          <button id="monoPassBtn" class="hidden mono-btn" data-i18n="monPass">Pass</button>
                          <button id="monoEndBtn" class="hidden mono-btn mono-btn-main" data-i18n="monEndTurn">End turn</button>
                          <button id="monoPayDebtBtn" class="hidden mono-btn mono-btn-main" data-i18n="monPayDebt">Pay</button>
                          <button id="monoBankruptBtn" class="hidden mono-btn mono-btn-danger" data-i18n="monBankrupt">Bankrupt</button>
                          <button id="monoTradeBtn" class="hidden mono-btn"><i class="fa-solid fa-handshake"></i> <span data-i18n="monTrade">Trade</span></button>
                      </div>
                  </div>
              </div>

              <!-- Everything below the board -->
              <div class="w-full max-w-[820px] space-y-2">
                  <div id="monoTrade" class="hidden mono-panel"></div>

                  <div class="mono-panel">
                      <div class="mono-panel-title" data-i18n="monSquare">Square</div>
                      <div id="monoDetail"></div>
                  </div>

                  <div class="mono-panel">
                      <div class="mono-panel-title" data-i18n="monYourTitles">Your titles</div>
                      <div id="monoMine" class="flex flex-wrap gap-1"></div>
                  </div>

                  <div class="mono-panel">
                      <div class="mono-panel-title" data-i18n="monLog">Latest events</div>
                      <div id="monoEvents" class="mono-events"></div>
                  </div>

                  <div class="bg-slate-900/90 border border-slate-800 p-2 rounded-2xl flex items-center justify-between gap-2 backdrop-blur-md">
                      <button id="startMonopolioBtn" disabled class="items-center px-3.5 sm:px-5 py-1.5 rounded-xl bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-400 hover:to-orange-400 disabled:opacity-30 disabled:pointer-events-none text-white text-xs font-extrabold shadow transition">
                          <i class="fa-solid fa-house"></i> <span data-i18n="monStart">Start Match</span>
                      </button>
                      <button id="monoResignBtn" disabled class="px-3 sm:px-4 py-1.5 rounded-xl bg-rose-950/60 hover:bg-rose-900 disabled:opacity-30 disabled:pointer-events-none text-rose-300 text-xs font-extrabold transition" data-i18n="monResign">
                          Resign
                      </button>
                  </div>
              </div>
          </div>
</template>
